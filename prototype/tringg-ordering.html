<title>Tringg Ordering</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=DM+Serif+Display:ital@1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ── Tringg design system (unchanged tokens from Orders v7 / Calls / Menu Manager v5) ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --canvas:#F2F2EE;--panel:#FFFFFF;--sunken:#F7F6F1;
  --ink:#0E0E0E;--ink-80:#2A2A2A;--ink-70:#3B3B3B;--ink-50:#6B6B6B;--ink-30:#9A9A9A;--ink-15:#C9C9C7;
  --border:#E5E4DE;--border-s:#D4D3CC;
  --mint-500:#56C7B7;--mint-700:#1F6E62;--mint-50:#DAF1ED;
  --coral-500:#E26A6A;--coral-700:#8C2424;--coral-50:#FAE0E0;
  --sage-500:#4FA15A;--sage-700:#1F6B2D;--sage-50:#E4F2DE;
  --cream-500:#C99344;--cream-700:#6E4810;--cream-50:#F8ECD7;
  --dust-500:#7C6EE0;--dust-700:#3E3392;--dust-50:#ECE9FB;
  --deco-mint:#C7E9E2;--deco-coral:#F2C6C2;--deco-cream:#ECD7AC;--deco-dust:#DDD9F0;
  --nav-bg:#111;--nav-2:#1a1a1a;--nav-3:#252525;--nav-tx:#555;--nav-tx2:#ccc;
  --e1:0 1px 2px rgba(14,14,14,.06);
  --e2:0 12px 32px -8px rgba(14,14,14,.14);
  --e3:0 24px 60px -16px rgba(14,14,14,.22);
  --r-sm:8px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --ease:cubic-bezier(.2,.7,.2,1);--tf:120ms;--tm:200ms;
  --nav:220px;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--canvas);color:var(--ink);
  font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.shell{display:flex;height:100%;overflow:hidden}
:focus-visible{outline:2px solid var(--coral-500);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── SIDEBAR ─── */
.sidebar{width:var(--nav);flex-shrink:0;background:var(--nav-bg);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #1a1a1a;z-index:60}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 14px;border-bottom:1px solid #1e1e1e}
.sb-logo{font-family:"DM Serif Display",Georgia,serif;font-style:italic;font-size:24px;color:var(--mint-500);letter-spacing:-.5px;line-height:1}
.sb-kbd{width:26px;height:26px;border:1px solid #2a2a2a;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#555;font-size:11px}
.outlet-sel{margin:10px 10px 6px;padding:9px 12px;background:var(--nav-2);border:1px solid var(--nav-3);border-radius:var(--r-md);display:flex;align-items:center;gap:8px;cursor:pointer;color:#ccc;width:calc(100% - 20px);text-align:left;font-size:13px}
.outlet-sel:hover{background:#222}
.outlet-icon{width:20px;height:20px;border-radius:5px;background:var(--nav-3);border:1px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.outlet-sel-name{font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outlet-sel-count{font-size:11px;font-weight:600;color:#666}
.outlet-dd{margin:0 10px 6px;background:var(--nav-2);border:1px solid var(--nav-3);border-radius:var(--r-md);overflow:hidden}
.odi{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12.5px;color:#aaa;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.odi:hover{background:#222;color:#fff}
.odi.sel{color:#fff}
.od-dot{width:7px;height:7px;border-radius:50%;background:#333;flex-shrink:0}
.odi.sel .od-dot{background:var(--mint-500)}
.od-name{flex:1}
.od-badge{font-size:10px;font-weight:600;background:rgba(86,199,183,.15);color:var(--mint-500);padding:1px 5px;border-radius:4px}
.od-warn{font-size:10px;font-weight:600;background:rgba(226,106,106,.16);color:#F09A9A;padding:1px 5px;border-radius:4px}
.sb-nav{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.sb-nav::-webkit-scrollbar{display:none}
.nav-sec{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#3d3d3d;padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--nav-tx);cursor:pointer;background:none;border:0;width:100%;text-align:left;transition:background var(--tf) var(--ease),color var(--tf) var(--ease)}
.nav-item:hover{background:rgba(255,255,255,.05);color:#ccc}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff}
.nav-item svg{flex-shrink:0}
.nav-item.active svg{color:var(--mint-500)}
.nav-badge{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(86,199,183,.15);color:var(--mint-500);padding:1px 6px;border-radius:4px;line-height:1.4}
.nav-badge.amber{background:rgba(201,147,68,.2);color:#E4B775}
.nav-badge.lock{background:transparent;color:#444;font-weight:500}
.nav-progress{margin-left:auto;font-size:10px;font-weight:600;color:#E4B775}
/* prototype state switcher */
.proto{margin:8px 10px;padding:10px;border:1px dashed #2c2c2c;border-radius:var(--r-md)}
.proto-lbl{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;margin-bottom:7px;display:flex;justify-content:space-between}
.seg-dark{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#181818;border-radius:8px;padding:3px}
.seg-dark button{background:none;border:0;color:#777;font-size:11px;font-weight:600;padding:5px 0;border-radius:6px;cursor:pointer}
.seg-dark button.on{background:#2a2a2a;color:#fff}
.proto-hint{font-size:10.5px;color:#4d4d4d;margin-top:6px;line-height:1.4}
.sb-user{padding:10px 10px 12px;border-top:1px solid #1e1e1e;display:flex;align-items:center;gap:10px}
.user-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ECD7AC,#C99344);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#5a3a00;flex-shrink:0}
.user-name{font-size:12.5px;font-weight:500;color:#ccc;line-height:1.2}
.user-email{font-size:10.5px;color:#555;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}

/* ─── CONTENT ─── */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;box-shadow:var(--e1)}
.tb-icon.menu-btn{display:none}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.crumb{font-size:12.5px;color:var(--ink-50);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-search{display:flex;align-items:center;gap:7px;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);height:32px;padding:0 10px;width:220px}
.tb-search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:12.5px;color:var(--ink);width:100%}
.tb-search input::placeholder{color:var(--ink-30)}
.chip-status{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--panel);font-size:11.5px;font-weight:600;color:var(--ink-50);white-space:nowrap;cursor:pointer}
.chip-status .d{width:6px;height:6px;border-radius:50%;background:var(--ink-15)}
.chip-status.ok{border-color:var(--mint-500);background:var(--mint-50);color:var(--mint-700)}
.chip-status.ok .d{background:var(--mint-500)}
.chip-status.warn{border-color:var(--cream-500);background:var(--cream-50);color:var(--cream-700)}
.chip-status.warn .d{background:var(--cream-500)}
.chip-status.test{border-color:var(--dust-500);background:var(--dust-50);color:var(--dust-700)}
.chip-status.test .d{background:var(--dust-500)}
.tb-icon{width:32px;height:32px;border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-50);background:var(--panel);flex-shrink:0;position:relative}
.tb-icon:hover{background:var(--sunken);color:var(--ink)}
.tb-icon.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.notif-dot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--coral-500);border:1.5px solid var(--panel)}
.view{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar,.list-scroll::-webkit-scrollbar,.rp-body::-webkit-scrollbar{width:3px}
.scroll::-webkit-scrollbar-thumb,.list-scroll::-webkit-scrollbar-thumb,.rp-body::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:2px}
.page{padding:20px;display:flex;flex-direction:column;gap:16px;max-width:1240px}

/* ─── tiles ─── */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel)}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.stats.flat{padding:0;border:0;background:none}
.tile{border-radius:var(--r-lg);padding:15px 17px;display:flex;flex-direction:column;gap:7px;border:1px solid transparent;min-width:0}
.t-mint{background:var(--deco-mint)}.t-dust{background:var(--deco-dust)}.t-coral{background:var(--deco-coral)}.t-cream{background:var(--deco-cream)}
.t-plain{background:var(--panel);border-color:var(--border);box-shadow:var(--e1)}
.t-empty{background:var(--sunken);border:1px dashed var(--border-s)}
.tile-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);opacity:.55}
.tile-val{font-size:30px;font-weight:700;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.tile-val.md{font-size:22px;letter-spacing:-.5px}
.t-empty .tile-val{color:var(--ink-30)}
.tile-sub{font-size:11px;color:var(--ink-70)}
.t-empty .tile-sub{color:var(--ink-50)}

/* ─── generic card ─── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--e1);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-t{font-size:13.5px;font-weight:600;letter-spacing:-.1px}
.card-s{font-size:11.5px;color:var(--ink-50)}
.card-b{padding:14px 18px}
.card-h .btn{margin-left:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-50)}
.h1{font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1.2;text-wrap:balance}
.h2{font-size:16px;font-weight:700;letter-spacing:-.3px;text-wrap:balance}
.lead{font-size:13px;color:var(--ink-70);max-width:62ch}
.muted{color:var(--ink-50)}
.small{font-size:12px}
.xs{font-size:11px}

/* ─── pills & tags ─── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px 2px 5px;border-radius:var(--r-pill);white-space:nowrap;line-height:1.3}
.pill .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.p-dust{background:var(--dust-50);color:var(--dust-700)}.p-dust .dot{background:var(--dust-500)}
.p-mint{background:var(--mint-50);color:var(--mint-700)}.p-mint .dot{background:var(--mint-500)}
.p-live .dot{animation:pulse 1.6s ease-in-out infinite}
.p-sage{background:var(--sage-50);color:var(--sage-700)}.p-sage .dot{background:var(--sage-500)}
.p-grey{background:#EFECE7;color:var(--ink-70)}.p-grey .dot{background:var(--ink-50)}
.p-coral{background:var(--coral-50);color:var(--coral-700)}.p-coral .dot{background:var(--coral-500)}
.p-cream{background:var(--cream-50);color:var(--cream-700)}.p-cream .dot{background:var(--cream-500)}
.p-blink .dot{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(86,199,183,.5)}50%{box-shadow:0 0 0 3px rgba(86,199,183,0)}}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:500;padding:2px 5px;border-radius:4px;background:var(--sunken);color:var(--ink-70);white-space:nowrap}
.tag.cream{background:var(--cream-50);color:var(--cream-700)}
.tag.dust{background:var(--dust-50);color:var(--dust-700)}
.tag.mint{background:var(--mint-50);color:var(--mint-700)}
.tag.coral{background:var(--coral-50);color:var(--coral-700)}
.tag.sage{background:var(--sage-50);color:var(--sage-700)}
.tag.test{background:var(--ink);color:#fff;font-weight:700;letter-spacing:.06em}
.code{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-50);background:var(--sunken);border:1px solid var(--border);padding:0 4px;border-radius:4px;white-space:nowrap}

/* ─── buttons ─── */
.btn{font-family:inherit;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-md);border:1.5px solid transparent;padding:0 14px;height:36px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background var(--tf) var(--ease),box-shadow var(--tf) var(--ease)}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--e1)}
.btn-primary:hover{background:var(--ink-80);box-shadow:var(--e2)}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn-secondary:hover{background:var(--sunken)}
.btn-outline{background:#fff;color:var(--ink-70);border-color:var(--border)}
.btn-outline:hover{border-color:var(--ink);color:var(--ink)}
.btn-destr{background:#fff;color:var(--coral-700);border-color:var(--coral-500)}
.btn-destr:hover{background:var(--coral-50)}
.btn-ghost{background:transparent;color:var(--ink);border-color:transparent}
.btn-ghost:hover{background:var(--sunken)}
.btn-mint{background:var(--mint-500);color:var(--ink);border-color:var(--mint-500)}
.btn-sm{height:28px;font-size:11.5px;padding:0 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--mint-700);font-weight:600;cursor:pointer;background:none;border:0;font-size:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--mint-500)}

/* ─── banners ─── */
.banner{display:flex;align-items:flex-start;gap:10px;border-radius:var(--r-md);padding:10px 13px;font-size:12.5px;line-height:1.5;border:1px solid}
.banner svg{flex-shrink:0;margin-top:2px}
.banner .btn{margin-left:auto;flex-shrink:0}
.banner b{font-weight:600}
.b-cream{background:var(--cream-50);border-color:var(--cream-500);color:var(--cream-700)}
.b-coral{background:var(--coral-50);border-color:var(--coral-500);color:var(--coral-700)}
.b-mint{background:var(--mint-50);border-color:var(--mint-500);color:var(--mint-700)}
.b-dust{background:var(--dust-50);border-color:var(--dust-500);color:var(--dust-700)}
.b-plain{background:var(--sunken);border-color:var(--border);color:var(--ink-70)}

/* ─── empty states ─── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:40px 24px}
.empty-ic{width:48px;height:48px;border:1px solid var(--border);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;color:var(--ink-30);margin-bottom:6px;background:var(--panel)}
.empty-t{font-size:14px;font-weight:600;color:var(--ink)}
.empty-s{font-size:12.5px;color:var(--ink-50);max-width:44ch}
.empty .btn{margin-top:10px}
.empty-steps{display:flex;flex-direction:column;gap:6px;margin-top:14px;text-align:left;width:100%;max-width:340px}
.es{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-70);padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel)}
.es .n{width:18px;height:18px;border-radius:50%;background:var(--sunken);border:1px solid var(--border-s);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.es.done .n{background:var(--sage-500);border-color:var(--sage-500);color:#fff}
.es.done{color:var(--ink-50);text-decoration:line-through;text-decoration-color:var(--ink-15)}

/* ─── two-panel (orders, calls) ─── */
.panels{display:grid;grid-template-columns:minmax(0,1fr) 400px;flex:1;overflow:hidden;min-height:0}
.left-panel{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;background:var(--panel);min-width:0}
.left-head{padding:12px 16px 0;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border)}
.list-meta{font-size:12px;color:var(--ink-50);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list-meta strong{color:var(--ink);font-weight:600}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:12.5px;font-weight:500;color:var(--ink-50);padding:8px 12px;cursor:pointer;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:color var(--tf) var(--ease),border-color var(--tf) var(--ease)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tab .n{min-width:16px;height:16px;padding:0 4px;font-size:10px;font-weight:600;background:var(--sunken);color:var(--ink-70);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.tab.on .n{background:var(--ink);color:#fff}
.tab .n.amber{background:var(--cream-50);color:var(--cream-700)}
.tab.on .n.amber{background:var(--cream-700);color:#fff}
.list-toolbar{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.ls-box{display:flex;align-items:center;gap:6px;flex:1;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);height:30px;padding:0 10px;min-width:0}
.ls-box input{border:none;outline:none;background:transparent;font-family:inherit;font-size:12px;color:var(--ink);flex:1;min-width:0}
.fchips{display:flex;gap:5px;flex-shrink:0}
.fchip{font-size:11.5px;font-weight:500;padding:0 10px;height:30px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--panel);color:var(--ink-70);cursor:pointer;white-space:nowrap}
.fchip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.list-scroll{flex:1;overflow-y:auto;min-height:0}
.list-foot{padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--ink-50);flex-shrink:0;display:flex;gap:10px;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;width:100%;background:none;border-left:3px solid transparent;text-align:left;font-family:inherit;color:inherit;transition:background var(--tf) var(--ease)}
.row:hover{background:var(--sunken)}
.row.sel{background:var(--mint-50);border-left-color:var(--mint-500)}
.row.pend:not(.sel){background:#FFFDF5;border-left-color:var(--cream-500)}
.row.alert:not(.sel){border-left-color:var(--coral-500)}
.row.test:not(.sel){background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--sunken) 10px 20px)}

.rp-sub{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-50);margin-bottom:8px}
.rp-badges{display:flex;gap:5px;flex-wrap:wrap}
.rp-meta{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);flex-shrink:0}

.rp-g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sf-l{font-size:10.5px;color:var(--ink-50);margin-bottom:1px}
.sf-v{font-size:12.5px;font-weight:500;line-height:1.4;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.it{width:100%;border-collapse:collapse}

.totals{padding-top:6px;border-top:1px solid var(--border)}
.tll{display:flex;justify-content:space-between;padding:2px 0;font-size:12px;color:var(--ink-70)}

.tll.grand{border-top:1px solid var(--border-s);margin-top:5px;padding-top:8px;font-size:13px;font-weight:600;color:var(--ink)}

.special{background:var(--cream-50);border:1px solid var(--cream-500);border-radius:var(--r-md);padding:8px 11px;font-size:12px;color:var(--cream-700);line-height:1.5}
.handoff{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--sunken)}

.handoff.ok .ic{background:var(--sage-50);border-color:var(--sage-500);color:var(--sage-700)}
.handoff.fail{background:var(--coral-50);border-color:var(--coral-500)}

.rider-card{background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;display:flex;align-items:center;gap:9px}

.rider-empty{border:1px dashed var(--border-s);border-radius:var(--r-md);padding:12px;text-align:center;font-size:12px;color:var(--ink-30)}
.tline{display:flex;flex-direction:column}
.tli{display:flex;gap:9px;padding-bottom:12px;position:relative}

.tli:not(:last-child)::before{content:'';position:absolute;left:9px;top:19px;bottom:0;width:1px;background:var(--border)}
.tldot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;z-index:1;background:var(--panel)}

.tldot.sage{background:var(--sage-50);border-color:var(--sage-500)}

.tldot.cream{background:var(--cream-50);border-color:var(--cream-500)}
.tldot.dust{background:var(--dust-50);border-color:var(--dust-500)}
.tl-ev{font-size:12.5px;font-weight:500;padding-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl-mt{font-size:10.5px;color:var(--ink-50);margin-top:1px}
.notes{width:100%;padding:8px 11px;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);font-family:inherit;font-size:12.5px;color:var(--ink);resize:vertical;min-height:52px;outline:none}

.rp-foot{padding:11px 18px;border-top:1px solid var(--border);display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap;align-items:center}

.rp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-30);padding:32px;text-align:center}
.lifecycle{display:flex;gap:3px;margin-top:2px}
.lc{flex:1;height:4px;border-radius:2px;background:var(--border)}
.lc.done{background:var(--mint-500)}
.lc.cur{background:var(--ink)}
.lc-lbls{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-30);font-family:"JetBrains Mono",monospace;gap:3px}

/* call transcript */
.ai-sum{background:var(--mint-50);border:1px solid var(--deco-mint);border-radius:var(--r-md);padding:11px 13px;font-size:12.5px;line-height:1.55;color:var(--ink-80)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}

.turn.ai{background:var(--sunken);border:1px solid var(--border)}
.turn.cl{background:var(--panel);border:1px solid var(--border-s);align-self:flex-end}
.wave{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-md)}
.wave-bars{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.wave-bars i{flex:1;background:var(--ink-15);border-radius:1px}

.play{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* ─── overview ─── */
.hello{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello .date{font-family:"DM Serif Display",Georgia,serif;font-style:italic;font-size:28px;letter-spacing:-.5px;line-height:1.1}
.hello .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.attn{display:flex;flex-direction:column;gap:8px}
.review-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border)}

.rv-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rv-mid{flex:1;min-width:0}
.rv-t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-s{font-size:11.5px;color:var(--ink-50);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-card{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.agent-top{display:flex;align-items:center;gap:10px}
.agent-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--deco-mint),var(--mint-500));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);font-size:13px}

.now{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.bars{display:flex;flex-direction:column;gap:9px}

.bar-fill{height:100%;background:var(--mint-500);border-radius:4px}

.mini-row{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--border);font-size:12.5px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit;color:inherit}

/* setup checklist */
.setup-hero{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px;align-items:center}

.ring{position:relative;width:120px;height:120px;justify-self:center}

.steps{display:flex;flex-direction:column}

.step.cur .step-n{background:var(--ink);border-color:var(--ink);color:#fff}
.step.warn .step-n{background:var(--cream-50);border-color:var(--cream-500);color:var(--cream-700)}
.step-t{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step-s{font-size:12px;color:var(--ink-50);margin-top:2px}
.step.done .step-t{color:var(--ink-50)}
.golive{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--sunken);border-top:1px solid var(--border);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}

/* ─── sub-nav layout (menu, settings) ─── */
.split{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1;min-height:0;overflow:hidden}
.subnav{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:1px}
.subnav-h{font-size:15px;font-weight:700;letter-spacing:-.3px;padding:2px 10px 10px}
.sn-sec{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-30);padding:12px 10px 4px}
.sn-item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;background:none;border:0;width:100%;text-align:left;font-family:inherit;color:var(--ink-70)}

.sn-item.on{background:var(--sunken);color:var(--ink);box-shadow:inset 2px 0 0 var(--ink)}
.sn-t{font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.sn-s{font-size:11px;color:var(--ink-50);line-height:1.35;margin-top:1px}

.sn-count{margin-left:auto;font-size:10.5px;color:var(--ink-50);font-family:"JetBrains Mono",monospace}

/* ─── forms ─── */
.form{display:flex;flex-direction:column;gap:0}
.frow{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;padding:16px 18px;border-bottom:1px solid var(--border);align-items:start}
.frow:last-child{border-bottom:none}
.fl{font-size:13px;font-weight:600}
.fh{font-size:11.5px;color:var(--ink-50);margin-top:3px;line-height:1.45}
.fctl{display:flex;flex-direction:column;gap:8px;min-width:0}
.inp{height:36px;border:1px solid var(--border-s);border-radius:var(--r-md);padding:0 11px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);outline:none;width:100%;max-width:360px}
.inp:focus{border-color:var(--ink)}
.inp.sm{max-width:120px}
.inp-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inp-wrap .u{font-size:12px;color:var(--ink-50)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-50) 50%),linear-gradient(135deg,var(--ink-50) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea.inp{height:auto;min-height:72px;padding:9px 11px;resize:vertical;max-width:520px;line-height:1.5}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);padding:3px;gap:2px;flex-wrap:wrap}

.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--e1)}
.toggle{position:relative;width:36px;height:20px;border-radius:var(--r-pill);background:var(--ink-15);border:0;cursor:pointer;flex-shrink:0;transition:background var(--tm)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform var(--tm)}
.toggle.on{background:var(--mint-500)}
.toggle.on::after{transform:translateX(16px)}
.tg-row{display:flex;align-items:center;gap:12px}
.tg-row .tx{flex:1;min-width:0}
.check{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;background:var(--panel)}
.check.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.check .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-s);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.check.on .bx{background:var(--ink);border-color:var(--ink);color:#fff}
.check .t{font-size:12.5px;font-weight:600}
.check .s{font-size:11.5px;color:var(--ink-50)}
.dial{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--sunken);max-width:420px}
.dial .mono{font-size:13px;font-weight:500;flex:1}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-50);padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--sunken)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}

.tbl .num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunken)}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.scope{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);background:var(--dust-50);color:var(--dust-700)}
.stepper{display:flex;gap:0;align-items:center;flex-wrap:wrap;row-gap:8px}

function donut(parts){
  const tot=parts.reduce((a,p)=>a+p[0],0)||1;let off=0;const R=38,C=2*Math.PI*R;
  let s=`<svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="Order split"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--sunken)" stroke-width="14"/>`;
  parts.forEach(p=>{const len=p[0]/tot*C;s+=`<circle cx="55" cy="55" r="${R}" fill="none" stroke="${p[1]}" stroke-width="14" stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 55 55)"/>`;off+=len;});
  s+=`<text x="55" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" font-family="Geist,sans-serif">${tot}</text><text x="55" y="68" text-anchor="middle" font-size="9.5" fill="var(--ink-50)" font-family="Geist,sans-serif">orders</text></svg>`;
  return `<div class="donut-wrap">${s}<div class="legend">${parts.map(p=>`<div class="lg"><i style="background:${p[1]}"></i>${p[2]}<span class="v">${p[0]} · ${Math.round(p[0]/tot*100)}% · ${p[3]}</span></div>`).join('')}</div></div>`;
}

  ['parity','Pay at pickup, card link, tips','Matches Maple’s Pay-by-Link and pay in store.','docs.maple.inc/orders/faq'],
  ['open','Rider dispatch','Manual rider entry in v1. DoorDash Drive / Uber Direct in v2.','Order Module §3.8']],
  vs:[['Status sync','accept·deny·ready·complete','Full LimeTray lifecycle + POS webhooks'],['Change order','Cancel & re-place','Modify while PENDING'],['Decline','Charged, then refund','Hold released, nothing charged']]},
 calls:{sum:'Every call, what it was about, and what came of it. Linked both ways with Orders.',items:[
  ['beats','Order ↔ call traceability','Open the order from the call and the call from the order, with recording and transcript.','Ordering page §10'],
  ['beats','Hung-up recovery','Cart saved and a “finish your order” text sent. Shows as Unresolved with a call-back action.','Analysis §5'],
  ['parity','Spanish with English tickets','Maple: EN/ES/ZH. Tringg auto-detects Spanish and keeps the kitchen in English.','docs.maple.inc/voice-core'],
  ['parity','Transfer reasons','Bulk orders, “speak to a person”, complaints. Each transfer shows why and where it went.','docs.maple.inc/dashboard-overview']],
  vs:[['Unfinished calls','Not surfaced','Cart saved + recovery text'],['Transfer detail','Count only','Reason, destination, result']]},
 menu:{sum:'What Allie can sell. Four ways in: POS (direct or via Stream), another platform’s menu link, photos/PDF, or from scratch.',items:[
  ['decision','Stream as the multi-POS path (POC)','Direct Toast / Square / Clover stay. Other POS connect through Stream as a pilot, with menu sync first and order push validated per POS.','Product note Sep 2026'],
  ['beats','Import from photos or a delivery-app link','Maple needs a supported POS or a manual build. Tringg reads photos/PDF or DoorDash / Uber Eats / Grubhub links and flags low-confidence items for review.','Analysis §2.2'],
  ['beats','Menu readiness score','Shows items the AI can’t sell or describe (no description, allergens, missing POS item) before a caller hits them.','—'],
  ['parity','Modifier rules → questions','A POS group with min 1 becomes a required question, same as Maple on Toast. Groups with no max are flagged.','docs.maple.inc/orders/overview'],
  ['parity','Real-time availability','Turning an item off stops offers immediately. Synced from POS sold-out status where connected.','Menu Manager v5 · On/Off'],
  ['beats','Half & half pizzas','Supported as one line with two halves. Reviews say Maple struggles with this.','Analysis §2.7']],
  vs:[['Menu source','POS or manual','POS · Stream · link · photos · manual'],['Quality check','Test calls','Readiness score + review step']]},
 agents:{sum:'Who answers, how they sound, and the order Allie follows on every call.',items:[
  ['beats','Test mode','Calls to the test number create TEST orders that never reach the kitchen.','—'],

  ['decision','Always confirm a mobile number','Caller ID through forwarding isn’t guaranteed, and pay links and receipts depend on it.','Overview PRD §18.4'],
  ['decision','After-hours: take a message','Instead of transferring to an empty restaurant.','—']],vs:[['Testing','Live kitchen only','Test number + TEST orders']]},
 settings:{sum:'Everything that changes how orders are taken, paid for and handed to the kitchen. Outlet sections follow the sidebar outlet. Brand sections apply everywhere.',items:[
  ['beats','Kitchen hand-off per outlet with fallback chain','POS → retry → backup print → dashboard → manager text. Works for outlets without a POS.','Analysis §3'],
  ['parity','Zones, fee, minimum, prep time','Plus busy mode (+15 min, auto-off) and bulk orders sent to staff.','Settings PRD §9'],
  ['parity','Text registration status','A2P 10DLC takes 2–3 days (same as Maple). Started early in setup.','docs.maple.inc/voice-core/sms-a2p'],

  ['open','Fulfilment beyond v1','Courier dispatch, scheduled / catering orders, delivery tracking link.','Analysis §5']],
  vs:[['POS reach','Many via partnerships','Direct 3 + Stream pilot'],['No-POS outlets','Manual menu','Printer / tablet + photo import']]},

};
const SPECTAG={beats:['p-mint','Ahead of Maple'],parity:['p-grey','Maple parity'],decision:['p-dust','Decision'],open:['p-cream','Open question']};
function renderOverlay(){
  let h='';
  if(S.spec){const sp=SPEC[S.route]||SPEC.overview;
    h+=`<div class="scrim" onclick="S.spec=false;renderOverlay();renderTopbar()"></div><aside class="drawer" aria-label="Spec notes"><div class="drawer-h"><div><div class="eyebrow">Spec notes · ${TITLES[S.route]}</div><div class="h2" style="margin-top:3px">How this screen stands against Maple</div></div><button class="x" aria-label="Close" onclick="S.spec=false;renderOverlay();renderTopbar()">${I.x}</button></div>
     <div class="drawer-b"><p class="small" style="color:var(--ink-70)">${sp.sum}</p>
     ${sp.vs.length?`<div class="vs"><div class="h">Maple</div><div class="h">Tringg</div>${sp.vs.map(r=>`<div><b style="font-weight:600">${r[0]}</b><br>${r[1]}</div><div><br>${r[2]}</div>`).join('')}</div>`:''}
     ${sp.items.map(i=>`<div class="spec-item"><div class="k">${pillX(SPECTAG[i[0]][0],SPECTAG[i[0]][1])}<b style="font-size:12.5px">${i[1]}</b></div><p>${i[2]}</p><span class="ref">${i[3]}</span></div>`).join('')}
     <div class="xs muted">Maple details come from docs.maple.inc via search snippets and press releases (Sep 2026). Weaknesses come from competitor-written reviews.</div></div></aside>`;}
  if(S.menu.product){const it=DB.items.find(i=>i.id===S.menu.product)||MENU.items.find(i=>i.id===S.menu.product);
    if(it){const groups=MENU.groups.filter(g=>it.mods.includes(g.n));
    h+=`<div class="scrim" onclick="S.menu.product=null;renderOverlay()"></div><aside class="drawer" aria-label="Edit item"><div class="drawer-h"><div><div class="eyebrow">${it.cat}</div><div class="h2" style="margin-top:3px">${esc(it.n)}</div></div><button class="x" aria-label="Close" onclick="S.menu.product=null;renderOverlay()">${I.x}</button></div>
     <div class="drawer-b">${it.issue?`<div class="banner b-cream">${I.warn}<div>${esc(it.issue)}</div></div>`:''}
      ${DB.menuSource==='Square'?`<div class="banner b-plain">${I.pos}<div>Name and price come from Square. Change them there. Description, allergens and suggestions are Tringg-only.</div></div>`:''}
      <div><label class="fl" for="pd-desc">Description</label><textarea class="inp" id="pd-desc" style="margin-top:6px" placeholder="What’s on it? Allie reads this when callers ask.">${esc(it.desc)}</textarea></div>
      <div><div class="fl">Allergens</div><div class="chips">${['Gluten','Milk','Egg','Peanuts','Tree nuts','Soy','Fish','Shellfish','Sesame'].map(a=>`<button class="fchip ${it.all.includes(a)?'sel':''}" style="height:26px" onclick="this.classList.toggle('sel')">${a}</button>`).join('')}</div></div>
      <div><div class="fl">Choices Allie asks</div><div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">${groups.length?groups.map(g=>`<div class="ask"><div class="q">${g.n} · <span class="muted" style="font-weight:500">${g.rule}</span></div>${g.ask==='—'?'Not asked':'“'+esc(g.ask)+'”'}</div>`).join(''):'<span class="small muted">No choices. Allie just confirms quantity.</span>'}</div></div>
      <div><label class="fl" for="pd-up">Suggest with this item</label><select class="inp" id="pd-up" style="margin-top:6px"><option>${esc(it.up)||'None'}</option><option>Garlic Knots</option><option>Caesar Salad</option><option>Tiramisu</option></select></div>
      <div><div class="fl">Available at</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">${OUTLETS.map(o=>`<div class="tg-row"><span class="tx small">${o.short}</span><button class="toggle ${it.id==='d3'&&o.id==='rn'?(it.on?'on':''):'on'}" aria-label="${o.short}" onclick="this.classList.toggle('on')"></button></div>`).join('')}</div></div>
      <div class="ask"><div class="q">How Allie offers it</div>“${esc(it.n)}${it.desc?' — '+esc(it.desc.split(',')[0].toLowerCase()):''}. It’s ${money(it.p)}${groups.find(g=>g.n==='Size')?' for a 12-inch':''}.”</div></div>
     <div class="drawer-f"><button class="btn btn-ghost" onclick="S.menu.product=null;renderOverlay()">Cancel</button><button class="btn btn-primary" onclick="saveItem('${it.id}')">Save item</button></div></aside>`;}}
  if(S.modal){const m=S.modal;const o=DB.orders.find(x=>x.id===m.id);
    if(m.type==='decline'){const charged=o.payState==='paid'&&o.pay==='card';
      h+=`<div class="modal-ov" onclick="if(event.target===this){S.modal=null;renderOverlay()}"><div class="modal" role="dialog" aria-modal="true"><div class="modal-title">Decline order ${o.id}?</div><div class="modal-body"><span>${esc(o.name)} gets a text with the reason. ${charged?'<b>'+money(totT(o))+'</b> is refunded automatically.':o.pay==='card'?'The card hold is released, so nothing is charged.':'Nothing was paid yet.'}</span>
       <div class="radio-list">${['Item unavailable','Kitchen too busy','Closing soon','Outside delivery area','Other'].map((r,i)=>`<button class="radio ${m.reason===r||(!m.reason&&i===0)?'on':''}" onclick="S.modal.reason='${r}';renderOverlay()"><span class="o"></span>${r}</button>`).join('')}</div></div>
       <div class="modal-foot"><button class="btn btn-ghost" onclick="S.modal=null;renderOverlay()">Keep order</button><button class="btn btn-destr" onclick="confirmDecline()">Decline & notify</button></div></div></div>`;}
    if(m.type==='rider')h+=`<div class="modal-ov" onclick="if(event.target===this){S.modal=null;renderOverlay()}"><div class="modal" role="dialog" aria-modal="true"><div class="modal-title">Assign a rider to ${o.id}</div><div class="modal-body">
       <label class="fl" for="rd-n">Name</label><input class="inp" id="rd-n" value="Marcus T."><label class="fl" for="rd-p">Phone</label><input class="inp" id="rd-p" value="(312) 555-0198"><div class="seg"><button class="on">In-house</button><button>Third-party</button><button>Self</button></div></div>
       <div class="modal-foot"><button class="btn btn-ghost" onclick="S.modal=null;renderOverlay()">Cancel</button><button class="btn btn-primary" onclick="assignRider()">Assign rider</button></div></div></div>`;}
  $('overlay').innerHTML=h;
}
function openModal(type,id){S.modal={type,id};renderOverlay();}
function confirmDecline(){const o=DB.orders.find(x=>x.id===S.modal.id);const r=S.modal.reason||'Item unavailable';o.state='DECLINED';o.reason=r;
  const wasPaid=o.payState==='paid'&&o.pay==='card';o.payState=o.pay==='card'?(wasPaid?'paid':'released'):o.payState;
  tlPush(o,'Declined · '+r.toLowerCase(),'DECLINED','You · caller texted','coral');if(o.pay==='card')tlPush(o,wasPaid?'Refunded '+money(totT(o)):'Card hold released','','System','ink');
  S.modal=null;renderOverlay();toast('Order '+o.id+' declined · caller notified');renderOrders();}
function assignRider(){const o=DB.orders.find(x=>x.id===S.modal.id);o.rider={name:$('rd-n').value||'Rider',phone:$('rd-p').value,type:'In-house'};tlPush(o,'Rider assigned · '+o.rider.name,'','You','ink');S.modal=null;renderOverlay();toast('Rider assigned');renderOrders();}
function saveItem(id){const it=DB.items.find(i=>i.id===id);if(it){const d=$('pd-desc').value.trim();it.desc=d;if(d&&it.id==='p5'){it.issue=null;it.all=['Gluten','Milk'];}if(it.id==='d3'){it.on=true;it.issue=null;}}
  S.menu.product=null;renderOverlay();render();toast('Saved · Allie uses the new details on the next call');}

/* ════════════ BOOT ════════════ */
const VIEWS={overview:vOverview,orders:vOrders,calls:vCalls,menu:vMenu,agents:vAgents,settings:vSettings,reservations:vReservations};
function goLive(){if(setupDone()<6){toast('Finish the remaining steps first');return;}setScen('live');toast('You’re live · Allie is answering at 3 outlets');}
if(S.scen==='live'&&!S.orders.sel)S.orders.sel=null;
render();
</script>
