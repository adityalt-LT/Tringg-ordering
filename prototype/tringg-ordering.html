 orders:['Every phone order. States follow LimeTray. The POS sync switch sits top right because it decides who moves an order after acceptance.',[
  ['decision','POS sync switch in the header','On: statuses after Accepted arrive by POS webhook (Square). Off: staff move orders here. Loop has no POS, so it’s always manual.'],
  ['parity','Nothing charged until accepted · locked after','Same as Maple: a card is held on the call and charged on accept. Declined or expired orders release the hold, so there are no refunds. Accepted orders can’t be changed or cancelled.'],
  ['beats','Changes allowed before acceptance','Allie can still edit or cancel a PENDING order when the caller calls back. Maple makes the caller cancel and re-order.'],
  ['decision','No call buttons','No “call rider” or “call customer” actions. Riders are assigned; couriers are tracked.'],
  ['open','Cancel after accept','Out of scope. Merchants refund in Stripe for rare kitchen failures. Revisit if it happens often.']],
  [['Charge','Before kitchen (pay by link)','Hold on call, charge on accept'],['Decline','—','Hold released, no refund'],['Status sync','POS partners','POS webhooks + manual for no-POS']]],
 calls:['Unchanged layout from production, with an Orders tab and a link from each order call to its order.',[['parity','Order ↔ call link','Open the order from the call and the call from the order.']]],
 menu:['Four ways in. POS direct and Stream pilot keep POS as the source of truth; link import and photo upload help merchants without a POS.',[
  ['decision','Stream for other POS (POC)','Direct Toast / Square / Clover stay. Other POS connect through Stream: menu sync first, status sync per POS.'],
  ['beats','Google profile menu first','Pulled with the official Business Profile API (getFoodMenus) over the Google connection onboarding already has. Free, structured, one click. Maple needs a supported POS or a manual build.'],
  ['decision','Own website with consent','One fetch of the merchant’s own menu page after they confirm ownership. Structured schema.org data first, AI reading of the page text as fallback.'],
  ['decision','No scraping of delivery apps','DoorDash, Uber Eats and Grubhub terms ban automated access. The merchant saves their own store page as a PDF, and the photo/PDF reader handles it. No aggregator photos are copied. Phone prices can be set lower in one step.'],
  ['open','Official aggregator APIs','Uber Eats and DoorDash menu APIs need an approved partnership. Revisit with Stream or a direct partnership.']]],
 agents:['Agents keep their production layout. Capabilities replace per-module pricing.',[['decision','Capabilities','Enquiries always on. Reservations and Ordering switch per agent. Ordering can’t be turned on until a menu exists.'],['decision','Test mode removed','Not in this phase.']]],
 settings:['Ordering settings live in the All outlets view with per-outlet rows or tabs. The single-outlet view keeps phone, info, hours and FAQ, plus a read-only summary of that outlet’s ordering.',[
  ['decision','Stripe Connect, direct charges','Each brand connects its own Stripe account (Express). The merchant is merchant of record; Stripe takes 2.9% + 30¢; payouts go daily to their bank. Optional: one account per outlet.'],
  ['parity','How Maple pays merchants','Maple asks for KYC verification (2–3 business days) and a bank account before orders go live, and says payment processing is included in the plan. On SkyTab and SpotOn, money moves through the POS processor instead.'],
  ['beats','Polygon zones','Zones follow the river and expressway. Every address is checked during the call; outside every zone means Allie offers pickup.'],
  ['decision','Riders and couriers','Own riders (no calling from the dashboard) plus DoorDash Drive or Uber Direct, with tracking fed back into the order.'],
  ['decision','Removed this phase','Busy mode, bulk orders, kitchen hand-off, customer texts and test mode.']]],
 reservations:['Existing reservations module, shown so ordering sits alongside it in the same system.',[]]};
const STAG={beats:['p-mint','Ahead of Maple'],parity:['p-grey','Maple parity'],decision:['p-dust','Decision'],open:['p-amber','Open question']};
function renderOverlay(){let h='';
  if(S.spec){const sp=SPEC[S.route]||SPEC.overview;h+=`<div class="scrim" onclick="S.spec=false;renderOverlay();renderTop()"></div><aside class="drawer" aria-label="Spec notes"><div class="drawer-h"><div><div class="eyebrow">Spec notes</div><div class="h2" style="margin-top:4px">${esc((NAV.find(n=>n[0]===S.route)||['','Settings'])[1])} · vs Maple</div></div><button class="x" aria-label="Close" onclick="S.spec=false;renderOverlay();renderTop()">${I.x}</button></div><div class="drawer-b"><p class="small" style="color:var(--ink-70)">${sp[0]}</p>
   ${sp[2]?`<div class="vs"><div class="h"></div><div class="h">Maple</div><div class="h">Tringg</div>${sp[2].map(r=>`<div style="font-weight:600">${r[0]}</div><div>${r[1]}</div><div>${r[2]}</div>`).join('')}</div>`:''}
   ${sp[1].map(i=>`<div class="spec"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill(STAG[i[0]][0],STAG[i[0]][1])}<b style="font-size:14px;font-weight:600">${i[1]}</b></div><p>${i[2]}</p></div>`).join('')}
   <div class="xs muted">Maple details from docs.maple.inc (search snippets) and press releases, Sep 2026.</div></div></aside>`;}
  if(S.agentEdit){const noMenu=DB.menuState!=='live';h+=`<div class="scrim" onclick="S.agentEdit=false;renderOverlay()"></div><aside class="drawer" aria-label="Edit agent"><div class="drawer-h"><div><div class="eyebrow">Edit agent</div><div class="h2" style="margin-top:4px">${BRAND.agent}</div></div><button class="x" aria-label="Close" onclick="S.agentEdit=false;renderOverlay()">${I.x}</button></div><div class="drawer-b">
   <div class="fl">Capabilities</div>
   <div class="cap-row"><div class="tx"><div class="t">Enquiries</div><div class="s">Hours, location, menu questions, FAQ. Always on.</div></div><button class="tog on" disabled aria-label="Enquiries"></button></div>
   <div class="cap-row"><div class="tx"><div class="t">Reservations</div><div class="s">Books, changes and cancels tables.</div></div><button class="tog ${DB.caps.res?'on':''}" aria-label="Reservations" onclick="DB.caps.res=!DB.caps.res;render()"></button></div>
   <div class="cap-row"><div class="tx"><div class="t">Ordering</div><div class="s">${noMenu?'Add a menu first. Allie can’t sell without one.':'Takes pickup and delivery orders, and sends the payment link if the caller pays on the call.'}</div></div><button class="tog ${DB.caps.ord?'on':''}" ${noMenu?'disabled':''} aria-label="Ordering" onclick="DB.caps.ord=!DB.caps.ord;DB.orderingOn=DB.caps.ord;render();toast(DB.caps.ord?'Ordering on · Allie takes orders from her next call':'Ordering off')"></button></div>
   ${noMenu?`<button class="btn btn-line btn-sm" style="align-self:flex-start" onclick="S.agentEdit=false;go('menu')">Add menu</button>`:''}
   <div class="sep"></div><div class="field"><label class="fl" for="vc">Voice</label><select class="inp" id="vc"><option>Allie · warm, US</option><option>Marco</option><option>June</option></select></div>
   <div class="field"><label class="fl" for="gr">Greeting</label><textarea class="inp" id="gr">Thanks for calling ROSSA {outlet}, this is Allie. How can I help?</textarea></div>
   <div class="field"><span class="fl">Languages</span><div class="dchips"><button class="on">English</button><button class="on">Spanish</button><button>Mandarin</button></div></div>
   ${DB.caps.ord?`<div class="sep"></div><div class="fl">When taking orders</div>${[['Read the whole order back','Items, choices and total. Always on.',true,true],['Confirm the mobile number','Needed for the payment link.',true],['Offer one suggestion','From “Suggest with” in Menu.',true],['Explain that accepted orders are final','So callers know changes must happen before acceptance.',true,true]].map(r=>`<div class="tg"><div class="tx"><div class="small" style="font-weight:600">${r[0]}</div><div class="xs muted">${r[1]}</div></div><button class="tog ${r[2]?'on':''}" ${r[3]?'disabled':''} aria-label="${r[0]}" onclick="this.classList.toggle('on')"></button></div>`).join('')}`:''}
   </div><div class="drawer-f"><button class="btn btn-ghost" onclick="S.agentEdit=false;renderOverlay()">Cancel</button><button class="btn btn-dark" onclick="S.agentEdit=false;render();toast('Agent saved')">Save</button></div></aside>`;}
  if(S.menu.product){const it=DB.items.find(i=>i.id===S.menu.product);if(it){const gs=MENU.groups.filter(g=>it.mods.includes(g.n));
   h+=`<div class="scrim" onclick="S.menu.product=null;renderOverlay()"></div><aside class="drawer" aria-label="Edit item"><div class="drawer-h"><div><div class="eyebrow">${it.cat}</div><div class="h2" style="margin-top:4px">${esc(it.n)} · ${money(it.p)}</div></div><button class="x" aria-label="Close" onclick="S.menu.product=null;renderOverlay()">${I.x}</button></div><div class="drawer-b">
    ${it.issue?`<div class="banner b-amber">${I.warn}<div>${esc(it.issue)}</div></div>`:''}${DB.menuSource==='Square'?`<div class="banner b-grey" style="font-size:13px">${I.pos.replace('width="22" height="22"','width="17" height="17"')}<div>Name, price and sold-out status come from Square.</div></div>`:''}
    <div class="field"><label class="fl" for="pd">Description</label><textarea class="inp" id="pd" placeholder="What’s on it? Allie reads this when callers ask.">${esc(it.desc)}</textarea></div>
    <div class="field"><span class="fl">Allergens</span><div class="dchips">${['Gluten','Milk','Egg','Peanuts','Tree nuts','Soy','Fish','Sesame'].map(a=>`<button class="${it.all.includes(a)?'on':''}" onclick="this.classList.toggle('on')">${a}</button>`).join('')}</div></div>
    <div class="field"><span class="fl">Choices Allie asks</span>${gs.length?gs.map(g=>`<div class="ask"><b>${g.n}</b> · ${g.rule}<br>${g.ask==='—'?'Not asked':'“'+esc(g.ask)+'”'}</div>`).join(''):'<span class="small muted">No choices.</span>'}</div>
    <div class="field"><label class="fl" for="up">Suggest with this item</label><select class="inp" id="up"><option>${esc(it.up)||'None'}</option><option>Garlic Knots</option><option>Caesar Salad</option></select></div></div>
    <div class="drawer-f"><button class="btn btn-ghost" onclick="S.menu.product=null;renderOverlay()">Cancel</button><button class="btn btn-dark" onclick="saveItem('${it.id}')">Save</button></div></aside>`;}}
  if(S.modal){const m=S.modal;
   if(m.t==='decline'){const o=DB.orders.find(x=>x.id===m.id);h+=`<div class="modal-ov" onclick="if(event.target===this){S.modal=null;renderOverlay()}"><div class="modal" role="dialog" aria-modal="true"><div class="t">Decline ${o.id}?</div><div class="b">${o.pay==='before'?'The card hold of <b>'+money(totT(o))+'</b> is released. Nothing was charged, so there’s nothing to refund.':'Nothing was paid.'} Allie tells the caller if they call back.</div>
    <div class="radios">${['Kitchen too busy','Item unavailable','Closing soon','Outside delivery area','Other'].map((r,i)=>`<button class="radio ${(m.r||'Kitchen too busy')===r?'on':''}" onclick="S.modal.r='${r}';renderOverlay()"><span class="o"></span>${r}</button>`).join('')}</div>
    <div class="f"><button class="btn btn-ghost" onclick="S.modal=null;renderOverlay()">Keep order</button><button class="btn btn-red" onclick="declineOrder()">Decline</button></div></div></div>`;}
   if(m.t==='rider'){const on=DB.riders.filter(r=>r.on);h+=`<div class="modal-ov" onclick="if(event.target===this){S.modal=null;renderOverlay()}"><div class="modal" role="dialog" aria-modal="true"><div class="t">Assign a rider</div><div class="b">Riders on shift at ${esc(ON(DB.orders.find(x=>x.id===m.id).outlet).short)}.</div><div class="radios">${on.map((r,i)=>`<button class="radio ${(m.r||on[0].n)===r.n?'on':''}" onclick="S.modal.r='${r.n}';renderOverlay()"><span class="o"></span>${r.n}</button>`).join('')}</div><div class="f"><button class="btn btn-ghost" onclick="S.modal=null;renderOverlay()">Cancel</button><button class="btn btn-dark" onclick="assignRider()">Assign</button></div></div></div>`;}
   if(m.t==='stripe')h+=`<div class="modal-ov" onclick="if(event.target===this){S.modal=null;renderOverlay()}"><div class="modal" role="dialog" aria-modal="true"><div class="t">Connect with Stripe</div><div class="b">You’ll finish on Stripe’s secure page, then come back here. Have your EIN, the owner’s ID and your bank details ready. Takes about 10 minutes; Stripe verifies in 1–3 business days.</div>
    <div class="guide" style="margin:0"><div class="gstep"><span class="n">1</span><div><div class="t">Business details</div></div></div><div class="gstep"><span class="n">2</span><div><div class="t">Identity check (KYC)</div></div></div><div class="gstep"><span class="n">3</span><div><div class="t">Bank account for payouts</div></div></div></div>
    <div class="f"><button class="btn btn-ghost" onclick="S.modal=null;renderOverlay()">Cancel</button><button class="btn btn-dark" onclick="S.modal=null;DB.stripe='pending';render();toast('Details sent to Stripe for verification')">Continue to Stripe</button></div></div></div>`;}
  $('overlay').innerHTML=h;}
function declineOrder(){const o=DB.orders.find(x=>x.id===S.modal.id),r=S.modal.r||'Kitchen too busy';o.state='DECLINED';o.reason=r;logEv(o,'DECLINED','Staff · '+r.toLowerCase());if(o.pay==='before'){o.payState='voided';o.pevt.push(['Hold released · nothing charged',realClock()]);}S.modal=null;renderOverlay();toast(o.id+' declined · nothing charged');renderOrders();}
function assignRider(){const o=DB.orders.find(x=>x.id===S.modal.id),n=S.modal.r||DB.riders.find(r=>r.on).n;o.courier={via:'own',rider:n,t:n+' · own rider',s:'Assigned '+realClock()};S.modal=null;renderOverlay();toast(n+' assigned to '+o.id);renderOrders();}
function saveItem(id){const it=DB.items.find(i=>i.id===id),d=$('pd').value.trim();it.desc=d;if(d&&id==='p5'){it.issue=null;it.all=['Gluten','Milk'];}S.menu.product=null;render();toast('Saved');}

const VIEWS={overview:vOverview,reservations:vReservations,orders:vOrders,calls:vCalls,menu:vMenu,agents:vAgents,settings:vSettings};
render();
</script>
