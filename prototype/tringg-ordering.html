 'ord-pay':()=>{
  const flowB=[['1 · On the call','Link texted','Card, Apple Pay or Google Pay on a Tringg checkout page'],['2 · Caller pays','Card held','Authorised, not charged. The order appears for you.'],['3a · You accept','Charged','Money goes to your Stripe balance','g'],['3b · Declined or expired','Hold released','Nothing charged, nothing to refund','r']];
  const flowA=[['1 · On the call','Order confirmed','No payment taken'],['2 · You accept','Order locked','Kitchen starts'],['3 · At the store','Paid in person','Card or cash at the counter, or at the door','g']];
  const fl=f=>`<div class="flow">${f.map((n,i)=>`<div class="fnode ${n[3]||''}"><div class="k">${n[0]}</div><div class="t">${n[1]}</div><div class="s">${n[2]}</div></div>${i<f.length-1&&!(n[0].startsWith('3a'))?`<span class="farrow">${I.arrow}</span>`:''}`).join('')}</div>`;
  let st='';
  if(DB.stripe==='none')st=`<div class="banner b-amber">${I.card.replace('width="20" height="20"','width="17" height="17"')}<div><b>Connect Stripe to take card payments on the call.</b> Until then Allie only offers pay at the store.</div></div><div class="flow"><div class="fnode"><div class="k">Step 1</div><div class="t">Business details</div><div class="s">Legal name, EIN, address</div></div><div class="fnode"><div class="k">Step 2</div><div class="t">Identity check</div><div class="s">Owner ID and date of birth (KYC)</div></div><div class="fnode"><div class="k">Step 3</div><div class="t">Bank account</div><div class="s">Where payouts land</div></div></div><button class="btn btn-dark" style="align-self:flex-start" onclick="S.modal={t:'stripe'};renderOverlay()">Connect with Stripe</button>`;
  else if(DB.stripe==='pending')st=`<div class="banner b-dust">${I.clock.replace('width="22" height="22"','width="17" height="17"')}<div><b>Stripe is verifying your details.</b> Usually 1–3 business days. Pay-at-store orders work in the meantime.</div><button class="btn btn-proto btn-sm" onclick="DB.stripe='active';render();toast('Stripe verified')">Simulate approval</button></div>`;
  else st=`<div class="stripe-st"><div class="meta"><div class="l">Account</div><div class="v">ROSSA Pizzeria LLC</div></div><div class="meta"><div class="l">Verification</div><div class="v" style="color:var(--sage-700)">Verified</div></div><div class="meta"><div class="l">Payouts to</div><div class="v">Chase ••6789</div></div><div class="meta"><div class="l">Schedule</div><div class="v">Daily · 2 business days</div></div></div>
   <div class="tblw"><table class="tbl"><thead><tr><th>Payout</th><th>Orders</th><th>Gross</th><th>Stripe fees</th><th>To your bank</th><th>Status</th></tr></thead><tbody>
    <tr><td>Sep 30</td><td class="num">41</td><td class="num">$1,612.40</td><td class="num">−$58.66</td><td class="num" style="font-weight:600">$1,553.74</td><td>${pill('p-dust','In transit')}</td></tr><tr><td>Sep 29</td><td class="num">37</td><td class="num">$1,388.10</td><td class="num">−$51.36</td><td class="num" style="font-weight:600">$1,336.74</td><td>${pill('p-green','Paid')}</td></tr></tbody></table></div>
   <div class="small muted">Card payments are direct charges on your own Stripe account, so you’re the merchant of record and the statement reads “ROSSA PIZZERIA”. Stripe deducts its fee (2.9% + 30¢); Tringg takes no cut. Refunds and disputes are handled in your Stripe dashboard.</div>
   <div class="segp sm"><button class="on">One account for all outlets</button><button onclick="toast('Each outlet connects its own Stripe account')">Separate account per outlet</button></div>`;
  return sH('Payments & payouts','How callers pay, and how the money reaches you.','all')+`
  <div class="scard"><div class="h2">How callers can pay</div><div class="fh" style="margin-top:-10px">Allie asks which one the caller wants. At least one must stay on.</div>
   <button class="opt ${DB.payBefore?'on':''}" onclick="if(DB.payAfter||!DB.payBefore){DB.payBefore=!DB.payBefore;render()}else toast('Keep at least one option on')"><span class="bx">${I.check}</span><span><span class="t">Pay before · on the call ${DB.stripe!=='active'?pill('p-amber','Needs Stripe'):''}</span><span class="s" style="display:block">Allie texts a secure checkout link during the call. Card, Apple Pay and Google Pay.</span></span></button>
   <button class="opt ${DB.payAfter?'on':''}" onclick="if(DB.payBefore||!DB.payAfter){DB.payAfter=!DB.payAfter;render()}else toast('Keep at least one option on')"><span class="bx">${I.check}</span><span><span class="t">Pay after · at the store</span><span class="s" style="display:block">The customer pays at the counter or at the door. Nothing is taken on the call.</span></span></button></div>
  <div class="scard"><div class="h2">What happens to the money</div><div class="eyebrow" style="font-size:12px">Pay before</div>${fl(flowB)}<div class="eyebrow" style="font-size:12px">Pay after</div>${fl(flowA)}
   <div class="rules"><div class="rule"><span class="ic">${I.clock.replace('width="22" height="22"','width="15" height="15"')}</span><div>Unpaid links expire after <b style="font-weight:600">10 minutes</b>. No order is created, and the call is marked unpaid.</div></div><div class="rule"><span class="ic">${I.lock}</span><div>Once accepted, an order can’t be changed or cancelled by the caller or by Allie.</div></div></div></div>
  <div class="scard"><div class="scard-h"><div><div class="h2">Payouts · Stripe Connect</div><div class="fh">Card money goes to your own Stripe account, then to your bank.</div></div><div class="r">${DB.stripe==='active'?pill('p-green','Connected'):DB.stripe==='pending'?pill('p-dust','Verifying'):pill('p-grey','Not connected')}</div></div>${st}</div>`;},
 'ord-delivery':()=>{const o=S.zoneOutlet,mode=DB.deliveryMode[o],z=DB.zones[o];
  return sH('Delivery & pickup','Where each outlet delivers, what it costs, and who takes it.','all')+`
  <div class="segp">${OUTLETS.map(x=>`<button class="${o===x.id?'on':''}" onclick="S.zoneOutlet='${x.id}';S.zoneSel=DB.zones['${x.id}'][0].id;S.test=null;render()">${x.short}</button>`).join('')}</div>
  <div class="scard"><div class="h2">Services</div><div class="tg"><div class="tx"><div class="fl">Delivery</div><div class="fh">When off, Allie offers pickup only.</div></div><button class="tog on" aria-label="Delivery" onclick="this.classList.toggle('on')"></button></div><div class="sep"></div>
   <div class="tg"><div class="tx"><div class="fl">Pickup</div><div class="fh">Allie quotes the prep time from the moment the order is accepted.</div></div><input class="inp sm" aria-label="Prep minutes" value="20 min" style="max-width:100px"><button class="tog on" aria-label="Pickup" onclick="this.classList.toggle('on')"></button></div></div>
  <div class="scard"><div class="scard-h"><div><div class="h2">Delivery area</div><div class="fh">Zones follow real boundaries like the river and the expressway, which a radius can’t. Allie checks every address against them during the call.</div></div><div class="r segp sm"><button class="${mode==='radius'?'on':''}" onclick="DB.deliveryMode['${o}']='radius';S.test=null;render()">Radius</button><button class="${mode==='zones'?'on':''}" onclick="setZones('${o}')">Zones</button></div></div>
   <div class="map-wrap"><div><svg class="map" id="map" viewBox="0 0 600 380" role="img" aria-label="Delivery area map">${drawMap()}</svg><div class="xs muted" style="margin-top:8px">${mode==='zones'?'Drag the white handles to reshape the selected zone. Zones higher in the list win where they overlap.':'Everything inside the circle is one zone.'}</div></div>
    <div style="display:flex;flex-direction:column;gap:10px">${mode==='zones'?z.map(q=>`<button class="zone-li ${S.zoneSel===q.id?'on':''}" onclick="S.zoneSel='${q.id}';render()"><span class="sw" style="background:${q.c}"></span><span style="min-width:0;flex:1"><span class="t" style="display:block">${esc(q.n)}</span><span class="s" style="display:block">$${q.fee.toFixed(2)} fee · $${q.min} min · ${q.eta} min</span></span></button>`).join('')+`<button class="btn btn-soft btn-sm" onclick="addZone()">${I.plus} Add zone</button>`
     :`<div class="field"><label class="fl" for="rad">Radius</label><input class="inp" id="rad" value="3 miles"></div><div class="field"><label class="fl" for="rfee">Fee · minimum</label><input class="inp" id="rfee" value="$3.00 · $15"></div>`}
     <div class="sep"></div><label class="fl" for="tst">Check an address</label><select class="inp" id="tst" onchange="testAddr(this.value)"><option value="">Pick a sample address…</option>${TESTS.map((t,i)=>`<option value="${i}" ${S.test&&S.test.i===i?'selected':''}>${t[0]}</option>`).join('')}</select><div id="tres">${testResult()}</div></div></div></div>
  <div class="scard"><div class="h2">Who delivers</div>
   <div class="cap-row"><span class="stat-ic ic-mint" style="width:44px;height:44px">${I.scooter}</span><div class="tx"><div class="t">Your own riders</div><div class="s">Assign a rider from the order when it’s ready. No calls from here; riders see the address on the ticket.</div></div><span class="small muted">${DB.riders.filter(r=>r.on).length} on shift</span></div>
   <div class="tblw"><table class="tbl"><tbody>${DB.riders.map((r,i)=>`<tr><td style="font-weight:500">${r.n}</td><td class="small muted">In-house</td><td style="text-align:right"><span class="small muted" style="margin-right:10px">${r.on?'On shift':'Off'}</span><button class="tog ${r.on?'on':''}" aria-label="${r.n} on shift" onclick="DB.riders[${i}].on=!DB.riders[${i}].on;render()"></button></td></tr>`).join('')}</tbody></table></div>
   <div class="sep"></div>
   ${[['dd','DoorDash Drive','On-demand Dashers. Fee quoted per delivery, tracking comes back to the order.'],['uber','Uber Direct','On-demand couriers from Uber. Same flow as DoorDash Drive.']].map(p=>`<div class="cap-row"><span class="stat-ic ic-grey" style="width:44px;height:44px">${I.link}</span><div class="tx"><div class="t">${p[1]} ${DB.partners[p[0]]?pill('p-green','Connected'):''}</div><div class="s">${p[2]}</div></div><button class="btn ${DB.partners[p[0]]?'btn-soft':'btn-line'} btn-sm" onclick="DB.partners['${p[0]}']=!DB.partners['${p[0]}'];render();toast('${p[1]} '+(DB.partners['${p[0]}']?'connected':'disconnected'))">${DB.partners[p[0]]?'Disconnect':'Connect'}</button></div>`).join('')}
   <div class="frow"><div class="field"><span class="fl">Use for ${esc(ON(o).short)}</span><div class="segp sm"><button class="${o==='wp'?'on':''}">DoorDash Drive</button><button class="${o!=='wp'?'on':''}">Own riders</button><button>Own first, then courier</button></div></div>
    <div class="field"><span class="fl">Request a courier</span><div class="segp sm"><button class="on">When the order is ready</button><button>10 min before ready</button></div></div></div></div>`;},
 'ord-pos':()=>sH('POS sync','When sync is on, order statuses after acceptance come from your POS. Staff move orders on the POS or KDS, not here.','all')+`
  <div class="scard"><div class="scard-h"><span class="stat-ic ic-mint" style="width:44px;height:44px">${I.pos}</span><div><div class="h3">Square · Wicker Park, River North</div><div class="fh">Menu synced 4 min ago · 31 orders sent today · status webhooks on</div></div><div class="r"><button class="tog ${DB.posSync?'on':''}" aria-label="POS sync" onclick="togglePos()"></button></div></div>
   <div class="flow"><div class="fnode"><div class="k">Tringg</div><div class="t">Order accepted</div><div class="s">Sent to Square</div></div><span class="farrow">${I.arrow}</span><div class="fnode"><div class="k">Square webhook</div><div class="t">Preparing → Ready</div><div class="s">Updates the order here</div></div><span class="farrow">${I.arrow}</span><div class="fnode g"><div class="k">Square webhook</div><div class="t">Completed</div><div class="s">Picked up or delivered</div></div></div>
   <div class="small muted">ROSSA Loop has no POS, so its orders are always updated from the dashboard. The switch is also at the top right of Orders.</div></div>
  <div class="scard"><div class="scard-h"><div><div class="h3">Connect another POS</div><div class="fh">Toast, Square, Clover, SpotOn, SkyTab, Lightspeed, NCR Aloha and more. You sign in to your POS to approve it.</div></div><div class="r"><button class="btn btn-line" onclick="openPos()">Connect POS</button></div></div></div>`,
 msg:()=>sH('Messaging agent','Your existing messaging agent settings. Unchanged by ordering.','all')+`<div class="scard"><div class="soft-empty">Existing page · not part of this prototype</div></div>`,
 team:()=>sH('Users & roles','Who can see and act on orders.','all')+`<div class="scard"><div class="tblw"><table class="tbl"><thead><tr><th>Permission</th><th>Owner</th><th>Manager</th><th>Staff</th></tr></thead><tbody>${[['View orders, reservations and calls',1,1,1],['Accept, decline and advance orders',1,1,1],['Turn menu items on or off',1,1,1],['Delivery zones and riders',1,1,0],['Payments, payouts and Stripe',1,0,0],['Billing and team',1,0,0]].map(r=>`<tr><td>${r[0]}</td>${[1,2,3].map(i=>`<td>${r[i]?'<span style="color:var(--sage-700)">'+I.check+'</span>':'<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`,

   <div class="dchips">${['Enquiries','Reservations','Ordering'].map(x=>`<span class="tag" style="background:var(--mint-50);color:var(--mint-700);border-color:transparent">✓ ${x}</span>`).join('')}</div>
   <div class="small muted">Nothing is sold per module. Don’t want reservations or ordering? Switch that capability off for the agent in <button class="u-link" onclick="S.agentEdit=true;go('agents')">Agents › Edit</button>.</div></div>`
};
function fbChk(){const d=s=>s.replace(/\D/g,'');$('fberr').textContent=d($('rn1').value)&&d($('rn1').value)===d($('fb1').value)?'That’s your restaurant number. Use a different line.':'';}

/* ── polygon map ── */
const TESTS=[['1522 N Milwaukee Ave',318,176],['2400 W Fullerton Ave',236,96],['233 S Wacker Dr',300,248],['3100 N Clark St',540,40],['900 W Randolph St',470,330]];
function pip(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>p[1])!==(yj>p[1]))&&(p[0]<(xj-xi)*(p[1]-yi)/(yj-yi)+xi))c=!c;}return c;}
function zoneAt(x,y){const o=S.zoneOutlet;if(DB.deliveryMode[o]==='radius')return Math.hypot(x-300,y-190)<=120?{n:'Radius 3 mi',fee:3,min:15,eta:40}:null;return DB.zones[o].find(z=>z.pts.length&&pip([x,y],z.pts))||null;}
function testAddr(v){if(v===''){S.test=null;}else{const t=TESTS[+v];S.test={i:+v,n:t[0],x:t[1],y:t[2]};}$('map').innerHTML=drawMap();$('tres').innerHTML=testResult();}
function testResult(){if(!S.test)return '';const z=zoneAt(S.test.x,S.test.y);return z?`<div class="banner b-mint" style="font-size:13px">${I.check}<div><b>${esc(z.n)}</b> · $${z.fee.toFixed(2)} fee · $${z.min} min · about ${z.eta} min. Allie takes the order.</div></div>`:`<div class="banner b-amber" style="font-size:13px">${I.warn}<div><b>Outside every zone.</b> Allie offers pickup instead.</div></div>`;}
function drawMap(){const o=S.zoneOutlet,mode=DB.deliveryMode[o];
  let s=`<rect width="600" height="380" fill="#EEF0EA"/>`;
  for(let x=0;x<=600;x+=40)s+=`<line x1="${x}" y1="0" x2="${x}" y2="380" stroke="#fff" stroke-width="${x%120?1.5:4}"/>`;
  for(let y=0;y<=380;y+=40)s+=`<line x1="0" y1="${y}" x2="600" y2="${y}" stroke="#fff" stroke-width="${y%120?1.5:4}"/>`;
  s+=`<path d="M60 0 C 90 90, 150 150, 130 230 S 170 330, 150 380" fill="none" stroke="#CFE6EA" stroke-width="22"/><path d="M130 230 C 250 245, 380 250, 600 238" fill="none" stroke="#CFE6EA" stroke-width="16"/>`;
  s+=`<line x1="120" y1="380" x2="520" y2="0" stroke="#E9DFC6" stroke-width="7"/><rect x="430" y="250" width="90" height="60" rx="6" fill="#DCEBD7"/><text x="475" y="284" text-anchor="middle" font-size="11" fill="#6B6B6B" font-family="Poppins,sans-serif">Park</text><text x="92" y="60" font-size="11" fill="#6B8A90" font-family="Poppins,sans-serif">River</text>`;
  if(mode==='radius')s+=`<circle cx="300" cy="190" r="120" fill="rgba(79,194,180,.18)" stroke="#4FC2B4" stroke-width="2.5"/>`;
  else{[...DB.zones[o]].reverse().forEach(z=>{if(!z.pts.length)return;const sel=S.zoneSel===z.id;s+=`<polygon points="${z.pts.map(p=>p.join(',')).join(' ')}" fill="${z.c}" fill-opacity="${sel?.26:.14}" stroke="${z.c}" stroke-width="${sel?3:2}" data-zone="${z.id}" style="cursor:pointer"/>`;});
    const z=DB.zones[o].find(q=>q.id===S.zoneSel);if(z)z.pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="#fff" stroke="${z.c}" stroke-width="2.5" data-v="${i}" style="cursor:grab"/>`;});}
  s+=`<circle cx="300" cy="190" r="13" fill="#111"/><path d="M294 188h12v7h-12zM293 186l2-3h10l2 3" fill="none" stroke="#fff" stroke-width="1.6"/>`;
