<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Tringg · Set up your host</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--ink:#111;--mute:#6F6F6B;--faint:#A8A8A3;--line:#E9E8E4;--soft:#F6F6F3;--accent:#1F9E8E;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
html,body{height:100%}
body{font-family:"Poppins",system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{min-height:100vh;display:flex;flex-direction:column}
.bar{position:fixed;top:0;left:0;height:2px;background:var(--ink);transition:width .7s var(--ease);z-index:5}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:22px 32px}
.logo{font-weight:600;font-size:21px;letter-spacing:-.6px}
.logo i{font-style:normal;color:var(--accent)}
.step{font-size:13px;color:var(--mute)}
.page{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.col{width:100%;max-width:560px;flex:1;display:flex;flex-direction:column}
.body{flex:1;padding-top:clamp(24px,9vh,96px)}
.fade{animation:up .55s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ctx{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-bottom:22px}
.ctx::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
h1{font-size:clamp(28px,4vw,36px);line-height:1.18;font-weight:500;letter-spacing:-1px;min-height:1.18em}
h1 .caret{display:inline-block;width:2px;height:.9em;background:var(--ink);margin-left:3px;vertical-align:-.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{margin-top:12px;color:var(--mute);font-size:16px;opacity:0;animation:up .6s var(--ease) .5s both}
.sub.now{animation:none;opacity:1}
.sec{margin-top:36px}
.lbl{font-size:13px;color:var(--mute);margin-bottom:10px}

.in,.sel,.ta{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 14px;height:46px;outline:none;transition:border-color .2s}
.ta{height:auto;padding:11px 14px;resize:none;line-height:1.55}
.in:focus,.sel:focus,.ta:focus{border-color:var(--ink)}
.ask{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:0 18px;height:60px;transition:border-color .2s}
.ask:focus-within{border-color:var(--ink)}
.ask input{flex:1;border:0;outline:0;background:none;font-size:17px;min-width:0}
.ask input::placeholder{color:var(--faint)}
.ask>svg{color:var(--faint);flex-shrink:0}
.ask button{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}.field>span{font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13.5px;color:var(--mute);margin-top:16px}
.lnk{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint);font-size:inherit;transition:text-decoration-color .2s}
.lnk:hover{text-decoration-color:var(--ink)}

.btn{height:48px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s,transform .2s var(--ease)}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.18;cursor:not-allowed}
.btn.line{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.wide{width:100%}
.foot{position:sticky;bottom:0;display:flex;align-items:center;gap:16px;padding:16px 0 24px;margin-top:40px;background:var(--bg);border-top:1px solid var(--line)}
.back{color:var(--mute);font-size:14px;display:flex;align-items:center;gap:6px}.back:hover{color:var(--ink)}
.why{margin-left:auto;font-size:13px;color:var(--faint)}
.foot>.btn:last-child{margin-left:auto}.foot .why+.btn{margin-left:0}
.or{display:flex;align-items:center;gap:14px;margin:18px 0;color:var(--faint);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fine{font-size:12.5px;color:var(--faint);margin-top:20px}

.sg{display:flex;gap:14px;align-items:center;width:100%;padding:14px 4px;text-align:left;border-bottom:1px solid var(--line);transition:padding .2s var(--ease)}
.sg:first-child{margin-top:8px;border-top:1px solid var(--line)}
.sg:hover{padding-left:12px}
.sg b{display:block;font-weight:500;font-size:15px}.sg small{color:var(--mute);font-size:13px;display:block}
.sg>svg{margin-left:auto;color:var(--faint);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;transition:all .2s}
.chip:hover:not(:disabled){border-color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip:disabled{opacity:.4}

.log{margin-top:40px;display:flex;flex-direction:column;gap:16px}
.ln{display:flex;gap:12px;align-items:baseline;animation:up .5s var(--ease) both}
.ln i{width:16px;flex-shrink:0;color:var(--accent);font-style:normal;font-size:14px}
.ln.act i{color:var(--faint)}
.ln.act b{background:linear-gradient(90deg,var(--ink) 30%,var(--faint) 50%,var(--ink) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.ln b{font-weight:500}.ln span{color:var(--mute);font-size:14px;display:block}

.rows{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:8px 16px;padding:20px 0;border-top:1px solid var(--line);align-items:start}
.row>label{font-size:13px;color:var(--mute);padding-top:2px}
.row .v{font-size:15px;min-width:0}.row .v small{display:block;color:var(--mute);font-size:13.5px;margin-top:2px}
.row>.lnk{font-size:13.5px;color:var(--mute)}
.row .full{grid-column:2/4}
.map{position:relative;height:140px;border-radius:12px;overflow:hidden;background:var(--soft);margin-top:10px;cursor:crosshair;touch-action:none}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1px var(--ink);transform:translate(-50%,-50%);transition:left .25s var(--ease),top .25s var(--ease);pointer-events:none}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--faint);margin-top:8px}
.days{display:flex;gap:6px;margin:4px 0 12px}
.day{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);font-size:12px}.day.on{background:var(--ink);border-color:var(--ink);color:#fff}
.faq+.faq{margin-top:12px}.faq b{font-weight:500;font-size:14.5px;display:block}.faq span{color:var(--mute);font-size:13.5px}

.choice{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:16px 0;border-top:1px solid var(--line)}
.choice:last-of-type{border-bottom:1px solid var(--line)}
.rad{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);flex-shrink:0;margin-top:3px;display:grid;place-items:center;transition:all .2s}
.choice.on .rad{border-color:var(--ink)}.choice.on .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.choice b{font-weight:500;display:block}.choice .d{color:var(--mute);font-size:13.5px;display:block}
.choice .wave{margin-left:auto;align-self:center}
.stp{display:flex;align-items:center;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.stp:last-of-type{border-bottom:1px solid var(--line)}
.stp div{flex:1}.stp small{display:block;color:var(--mute);font-size:13px}
.stp button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:16px;line-height:1}.stp button:hover{border-color:var(--ink)}
.stp output{min-width:44px;text-align:center;font-weight:500}
.quote{margin-top:28px;padding-left:16px;border-left:2px solid var(--ink);font-size:15.5px;line-height:1.6}
.quote small{display:block;color:var(--faint);font-size:12px;margin-bottom:4px}
.wave{display:inline-flex;gap:2px;align-items:center;height:16px}
.wave s{display:block;width:2px;height:4px;border-radius:2px;background:var(--faint)}
.on-play .wave s{background:var(--accent);animation:bar .7s ease-in-out infinite}
@keyframes bar{50%{height:16px}}
.wave s:nth-child(2){animation-delay:.12s}.wave s:nth-child(3){animation-delay:.24s}.wave s:nth-child(4){animation-delay:.06s}

.chat{margin-top:28px;display:flex;flex-direction:column;gap:20px}
.m{max-width:88%;animation:up .4s var(--ease) both}
.m small{display:block;font-size:12px;color:var(--faint);margin-bottom:2px}
.m.g{align-self:flex-end;background:var(--soft);padding:9px 16px;border-radius:18px 18px 4px 18px}
.m.g small{display:none}
.dots{display:inline-flex;gap:4px;padding:6px 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-4px);background:var(--ink)}}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 14px}
.ready{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:28px;font-size:13px;color:var(--mute)}
.ready span::before{content:"✓";color:var(--accent);margin-right:6px}

.num{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.num .mono{font-size:20px;color:var(--ink);margin:0}.num .btn{margin-left:auto;height:36px;padding:0 16px;font-size:13px}
.check{display:flex;gap:10px;align-items:center;margin-top:22px;font-size:14px}.check input{width:18px;height:18px;accent-color:#111}
.fin{text-align:center;padding-top:clamp(40px,12vh,120px)}
.tick{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 28px;animation:pop .6s var(--ease) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fin .sub{margin-left:auto;margin-right:auto;max-width:440px}
.fin .num{justify-content:center;margin:32px 0 22px}.fin .mono{font-size:24px}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:left;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.next b{display:block;font-weight:500;font-size:14px}.next span{font-size:13px;color:var(--mute)}
@media (max-width:640px){.hdr{padding:18px 20px}.two,.next{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row>label{grid-column:1/-1;padding:0}.row .full{grid-column:1/-1}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="app"></div>
<script>
const OUTLETS=[
 {id:'abc',name:'ABC | ALADDIN BROASTED CHICKEN INDIRANAGAR',short:'Aladdin Broasted Chicken',area:'Indiranagar, Bengaluru',addr:'Ground floor, Shop 474, 10th Main Rd, HAL 3rd Stage, Indiranagar, Bengaluru 560075',cuisine:'Middle Eastern',country:'India',lat:12.97831,lng:77.64083,rating:'4.3 ★ from 1,284 reviews',
  desc:'Crispy broasted chicken, shawarma and rolls. Dine in, takeaway and delivery.',open:'11:00',close:'23:00',
  faqs:[['Is your chicken halal?','Yes, all our chicken is halal certified.'],['Do you have vegetarian options?','Yes: paneer rolls, veg shawarma and loaded fries.']]},
 {id:'music',name:'Music Café',short:'Music Café',area:'Patharagadia, Bhubaneswar',addr:'Patharagadia, Bhubaneswar, Odisha 751024',cuisine:'Café',country:'India',lat:20.36615,lng:85.79406,rating:'4.5 ★ from 612 reviews',
  desc:'A relaxed café with live music on weekends and an all-day menu.',open:'09:00',close:'23:00',
  faqs:[['Do you have live music?','Yes, every Friday and Saturday from 7 PM.'],['Is there parking?','There is street parking right outside.']]},
 {id:'rossa',name:'ROSSA Pizzeria',short:'ROSSA Pizzeria',area:'West Loop, Chicago',addr:'845 W Randolph St, Chicago, IL 60607',cuisine:'Italian',country:'United States',lat:41.88414,lng:-87.64798,rating:'4.6 ★ from 2,031 reviews',
  desc:'Wood-fired Neapolitan pizza, fresh pasta and an Italian wine list.',open:'16:00',close:'23:00',
  faqs:[['Do you have gluten-free crusts?','Yes, on any 12-inch pizza.'],['Can you host a private party?','Yes, up to 40 guests.']]}];
const CUISINES=['Middle Eastern','Café','Italian','North Indian','South Indian','Chinese','Burgers','Pizza','Bakery','Other'];
const VOICES=[{id:'allie',n:'Allie',t:'Warm and friendly',pitch:1.15,rate:1},{id:'marcus',n:'Marcus',t:'Calm and assured',pitch:.7,rate:.95},{id:'priya',n:'Priya',t:'Bright and quick',pitch:1.3,rate:1.08},{id:'leo',n:'Leo',t:'Upbeat and casual',pitch:.9,rate:1.1}];
const PRESETS={easy:{n:'Easygoing',d:'Say yes to most requests. Big groups welcome.',v:{maxParty:12,window:60,hold:20}},balanced:{n:'Balanced',d:'A sensible default for most restaurants.',v:{maxParty:8,window:30,hold:15}},selective:{n:'Selective',d:'Smaller parties, shorter window, tighter holds.',v:{maxParty:6,window:14,hold:10}}};
const DAYS=['M','T','W','T','F','S','S'],FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const GROUPS=['Discover','Verify','Reservation','Meet your agent','Review','Go live'];
const STEPS=[{id:'signup'},{id:'find',g:0},{id:'research',g:0},{id:'verify',g:1},{id:'rules',g:2},{id:'voice',g:3},{id:'test',g:4},{id:'live',g:5},{id:'done',g:6}];

const S={i:0,q:'',fresh:true,rs:0,edit:{},play:null,chat:[],typing:false,started:false,o:null,
 d:{brand:'',cuisine:'',country:'',desc:'',days:[1,1,1,1,1,1,1],open:'11:00',close:'23:00',lat:0,lng:0},
 rules:{preset:'balanced',maxParty:8,window:30,hold:15},agent:{voice:'allie',name:'Allie',lang:['English'],greet:''},fwd:'busy',fwdDone:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const t12=t=>{const[h,m]=t.split(':').map(Number);return`${h%12||12}${m?':'+String(m).padStart(2,'0'):''} ${h<12?'AM':'PM'}`};
function hoursText(){const on=S.d.days.filter(Boolean).length;if(!on)return'Closed every day';const days=on===7?'Every day':S.d.days.map((v,i)=>v?FULL[i].slice(0,3):null).filter(Boolean).join(', ');return`${days}, ${t12(S.d.open)} to ${t12(S.d.close)}`}
const brandShort=()=>S.d.brand||'your restaurant';
const greet=()=>S.agent.greet||`Thanks for calling ${brandShort()}, this is ${S.agent.name}. How can I help?`;

function go(i){S.i=i;S.fresh=true;scrollTo(0,0);render();if(STEPS[i].id==='research')runResearch()}
const next=()=>go(S.i+1),back=()=>go(S.i-1);
function footer(o){const{next:nl='Continue',ok=true,why='',hideBack=false}=o||{};
 return`<div class="foot">${hideBack?'':`<button class="back" onclick="back()">${ic('back',15)} Back</button>`}<span class="why">${ok?'':esc(why)}</span><button class="btn" ${ok?'':'disabled'} onclick="next()">${nl}</button></div>`}
const ctx=()=>S.o?`<div class="ctx">${esc(brandShort())} · ${esc(S.o.area)}</div>`:'';
const head=(t,s)=>`<h1 class="tw" data-t="${esc(t)}">${esc(t)}</h1>${s?`<p class="sub">${s}</p>`:''}`;

function render(){
 const id=STEPS[S.i].id,g=STEPS[S.i].g,v=VIEWS[id](),fresh=S.fresh;
 const label=g==null||g>=6?'':`Step ${g+1} of 6 · ${GROUPS[g]}`;
 $('#bar').style.width=(g==null?0:g>=6?100:(g+(id==='research'?.6:.5))/6*100)+'%';
 $('#app').innerHTML=`<header class="hdr"><div class="logo">Tringg<i>.</i></div><div class="step">${label}</div></header><main class="page"><div class="col">${v.body}${v.foot||''}</div></main>`;
 S.fresh=false;
 if(fresh)typeHeading();else document.querySelectorAll('.sub').forEach(e=>e.classList.add('now'));
 if(VIEWS_AFTER[id])VIEWS_AFTER[id]();
}
/* the agent "speaks" its heading */
function typeHeading(){const h=$('h1.tw');if(!h||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const t=h.dataset.t;
 let k=0;const tick=()=>{if(!h.isConnected)return;k++;h.innerHTML=esc(t.slice(0,k))+(k<t.length?'<span class="caret"></span>':'');if(k<t.length)setTimeout(tick,16)};tick()}

const VIEWS={},VIEWS_AFTER={};

VIEWS.signup=()=>({body:`<div class="body fade">${head('Let’s get your restaurant’s phone answered.','Tringg is an AI host that takes calls, bookings and orders. Setup takes about four minutes.')}
 <div class="sec"><button class="btn line wide" onclick="signup('priya@rossa.com')"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.5z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.2 13.6a6 6 0 0 1 0-3.8V7.1H2.7a10 10 0 0 0 0 9.2z"/><path fill="#EA4335" d="M12 6c1.5 0 2.9.5 4 1.6l3-3A10 10 0 0 0 2.7 7.1l3.5 2.7C7 7.8 9.3 6 12 6z"/></svg> Continue with Google</button>
 <div class="or">or</div>
 <form onsubmit="event.preventDefault();signup($('#em').value)"><div class="ask" style="height:52px;border-radius:999px"><input id="em" type="email" required placeholder="Work email" autocomplete="email" style="font-size:15px"/><button type="submit" aria-label="Continue">${ic('arrow',16)}</button></div></form>
 <p class="fine">By continuing you agree to Tringg’s Terms and Privacy Policy. Already have an account? <a class="lnk" href="#">Log in</a></p></div></div>`});
function signup(e){if(!e||!/.+@.+/.test(e))return;next()}

VIEWS.find=()=>({body:`<div class="body fade">${head('What’s your restaurant called?','Type its name or paste your website. I’ll do the rest.')}
 <div class="sec"><div class="ask">${ic('search',20)}<input id="q" autocomplete="off" placeholder="Restaurant name or website" value="${esc(S.q)}" oninput="onQ(this.value)" onkeydown="if(event.key==='Enter')pickFirst()" aria-label="Restaurant name or website"/></div><div id="sug"></div>
 <p class="hint">Can’t find it? <button class="lnk" onclick="manual()">Enter it manually</button></p></div></div>`});
VIEWS_AFTER.find=()=>{onQ(S.q);const q=$('#q');if(q)q.focus()};
function matches(q){q=q.trim().toLowerCase();if(!q)return[];
 if(/^(https?:\/\/|www\.)|\.[a-z]{2,}(\/|$)/.test(q))return[{...OUTLETS[0],viaUrl:q.replace(/^https?:\/\//,'')}];
 return OUTLETS.filter(o=>q.split(/\s+/).every(w=>(o.name+' '+o.area).toLowerCase().includes(w)))}
function onQ(v){S.q=v;const m=matches(v),el=$('#sug');if(!el)return;
 if(!v.trim()){el.innerHTML=`<p class="hint">Try <button class="lnk" onclick="try1('Aladdin')">Aladdin Broasted Chicken</button> or <button class="lnk" onclick="try1('ROSSA')">ROSSA Pizzeria</button></p>`;return}
 el.innerHTML=m.length?m.map(o=>`<button class="sg" onclick="pick('${o.id}')"><span><b>${esc(o.viaUrl?'Read '+o.viaUrl:o.name)}</b><small>${esc(o.viaUrl?'Pull name, hours and menu from this site':o.addr)}</small></span>${ic('arrow',16)}</button>`).join(''):`<p class="hint">No match for “${esc(v)}”. Try the full name with the neighbourhood, or paste your website.</p>`}
function try1(v){S.q=v;$('#q').value=v;onQ(v)}
function pickFirst(){const m=matches(S.q);if(m.length)pick(m[0].id)}
function pick(id){S.o=OUTLETS.find(o=>o.id===id);loadOutlet();next()}
function manual(){S.o={...OUTLETS[0],id:'manual',name:S.q||'My restaurant',faqs:[],desc:'',addr:'',area:'Add your location'};loadOutlet();S.i=3;S.fresh=true;S.edit={brand:true,hours:true};render()}
function loadOutlet(){const o=S.o;Object.assign(S.d,{brand:o.short||o.name,cuisine:o.cuisine,country:o.country,desc:o.desc,open:o.open,close:o.close,lat:o.lat,lng:o.lng,days:[1,1,1,1,1,1,1]});S.rs=0}

/* research: a quiet log of what the agent is doing */
const RS=[['Found your listing',()=>S.o.rating],['Read your website and reviews',()=>'Menu, photos and what guests mention'],['Mapped your location',()=>S.o.area],['Learned your opening hours',()=>hoursText()],['Drafted answers to common questions',()=>`${S.o.faqs.length} ready, starting with “${S.o.faqs[0][0]}”`]];
let rsT=null;
function runResearch(){clearInterval(rsT);S.rs=0;rsT=setInterval(()=>{if(STEPS[S.i].id!=='research'){clearInterval(rsT);return}S.rs++;if(S.rs>=6)clearInterval(rsT);render()},900)}
VIEWS.research=()=>{const done=S.rs>=6;
 return{body:`<div class="body fade">${head(done?`Here’s what I learned about ${S.d.brand}.`:`Reading up on ${S.d.brand}…`,done?'You’ll confirm each detail next. Nothing goes live until you say so.':'')}
 <div class="log">${RS.map((r,k)=>S.rs>k?`<div class="ln" style="animation:none"><i>✓</i><div><b>${r[0]}</b><span>${esc(r[1]())}</span></div></div>`:S.rs===k?`<div class="ln act" style="animation:none"><i>•</i><div><b>${r[0]}…</b></div></div>`:'').join('')}</div></div>`,
 foot:footer({ok:done,why:'',next:'Review'})}};

VIEWS.verify=()=>{const o=S.o,d=S.d,e=S.edit;
 const brand=e.brand?`<div class="full"><div class="two"><label class="field"><span>Name</span><input class="in" value="${esc(d.brand)}" oninput="S.d.brand=this.value"/></label><label class="field"><span>Cuisine</span><select class="sel" onchange="S.d.cuisine=this.value">${CUISINES.map(c=>`<option ${c===d.cuisine?'selected':''}>${c}</option>`).join('')}</select></label></div><label class="field" style="margin-top:12px"><span>Description</span><textarea class="ta" rows="2" oninput="S.d.desc=this.value">${esc(d.desc)}</textarea></label></div>`:`<div class="v">${esc(d.brand)}<small>${esc(d.cuisine)}${d.country?' · '+esc(d.country):''}</small><small>${esc(d.desc)}</small></div>`;
 const hrs=e.hours?`<div class="full"><div class="days">${DAYS.map((x,k)=>`<button class="day ${d.days[k]?'on':''}" aria-pressed="${!!d.days[k]}" aria-label="${FULL[k]}" onclick="S.d.days[${k}]^=1;render()">${x}</button>`).join('')}</div><div class="two"><label class="field"><span>Opens</span><input class="in" type="time" value="${d.open}" onchange="S.d.open=this.value"/></label><label class="field"><span>Closes</span><input class="in" type="time" value="${d.close}" onchange="S.d.close=this.value"/></label></div></div>`:`<div class="v">${esc(hoursText())}</div>`;
 return{body:`<div class="body fade">${head('Is this the right outlet?','I’ve filled in what I could. Change anything that’s off.')}
 <div class="sec rows">
  <div class="row"><label>Restaurant</label>${e.brand?'<span></span>':brand}<button class="lnk" onclick="tog('brand')">${e.brand?'Done':'Edit'}</button>${e.brand?brand:''}</div>
  <div class="row"><label>Location</label><div class="v">${esc(o.name)}<small>${esc(o.addr||'Drop a pin on the map')}</small></div><span></span>
   <div class="full"><div class="map" id="map" aria-label="Map. Click to move the pin."><svg class="bg" viewBox="0 0 600 140" preserveAspectRatio="none"><g stroke="#E4E3DD" stroke-width="8" fill="none"><path d="M0 45h600M0 105h600M130 0v140M310 0v140M470 0v140"/></g><g stroke="#ECEBE6" stroke-width="2" fill="none"><path d="M0 75h600M220 0v140M390 0v140"/></g></svg><div class="pin" id="pin" style="left:50%;top:55%"></div></div><div class="mono" id="coords">${d.lat.toFixed(5)}, ${d.lng.toFixed(5)} · click the map to move the pin</div></div></div>
  <div class="row"><label>Hours</label>${e.hours?'<span></span>':hrs}<button class="lnk" onclick="tog('hours')">${e.hours?'Done':'Edit'}</button>${e.hours?hrs:''}</div>
  <div class="row"><label>Answers</label><div class="v">${o.faqs.length?o.faqs.map(f=>`<div class="faq"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join(''):'<small>None yet. You can add them later in Settings.</small>'}</div><span></span></div>
 </div></div>`,foot:footer({next:'Looks right',ok:!!d.brand.trim(),why:'Add a restaurant name'})}};
VIEWS_AFTER.verify=()=>{const m=$('#map');if(!m)return;let drag=false;
 const set=ev=>{const r=m.getBoundingClientRect(),x=Math.min(Math.max(ev.clientX-r.left,0),r.width),y=Math.min(Math.max(ev.clientY-r.top,0),r.height);
  $('#pin').style.left=x/r.width*100+'%';$('#pin').style.top=y/r.height*100+'%';S.d.lat=S.o.lat+(.5-y/r.height)*.004;S.d.lng=S.o.lng+(x/r.width-.5)*.006;$('#coords').textContent=`${S.d.lat.toFixed(5)}, ${S.d.lng.toFixed(5)} · address updated`};
 m.onpointerdown=e=>{drag=true;m.setPointerCapture(e.pointerId);set(e)};m.onpointermove=e=>{if(drag)set(e)};m.onpointerup=()=>drag=false};
function tog(k){S.edit[k]=!S.edit[k];render()}

VIEWS.rules=()=>{const R=S.rules;
 const st=(k,l,u,mn,mx,step)=>`<div class="stp"><div>${l}<small>${u}</small></div><button aria-label="Decrease ${l}" onclick="bump('${k}',-${step},${mn},${mx})">−</button><output>${R[k]}</output><button aria-label="Increase ${l}" onclick="bump('${k}',${step},${mn},${mx})">+</button></div>`;
 return{body:`<div class="body fade">${ctx()}${head('How should I take bookings?','Pick a style. You can change any rule later.')}
 <div class="sec">${Object.entries(PRESETS).map(([k,p])=>`<button class="choice ${R.preset===k?'on':''}" onclick="preset('${k}')"><span class="rad"></span><span><b>${p.n}</b><span class="d">${p.d}</span></span></button>`).join('')}</div>
 <div class="sec"><div class="lbl">Fine-tune</div>${st('maxParty','Largest party','guests',1,30,1)}${st('window','Book ahead','days',1,90,1)}${st('hold','Hold the table','minutes',5,60,5)}</div>
 <div class="quote"><small>What callers will hear</small>“I can book up to ${R.maxParty} guests, up to ${R.window} days ahead, and I’ll hold your table for ${R.hold} minutes. For bigger groups I’ll take a note and the team will call back.”</div></div>`,foot:footer()}};
function preset(k){S.rules={preset:k,...PRESETS[k].v};render()}
function bump(k,dv,mn,mx){S.rules[k]=Math.min(mx,Math.max(mn,S.rules[k]+dv));S.rules.preset='custom';render()}

VIEWS.voice=()=>{const A=S.agent;
 return{body:`<div class="body fade">${ctx()}${head('Choose a voice.','Tap a voice to hear it read your greeting.')}
 <div class="sec">${VOICES.map(v=>`<button class="choice ${A.voice===v.id?'on':''} ${S.play===v.id?'on-play':''}" onclick="chooseVoice('${v.id}')" aria-pressed="${A.voice===v.id}"><span class="rad"></span><span><b>${v.n}</b><span class="d">${v.t}</span></span><span class="wave"><s></s><s></s><s></s><s></s></span></button>`).join('')}</div>
 <div class="sec"><div class="two"><label class="field"><span>Name</span><input class="in" value="${esc(A.name)}" oninput="S.agent.name=this.value||'Allie'" onchange="render()"/></label><div class="field"><span>Languages</span><div class="chips" style="padding-top:4px">${['English','हिन्दी','ಕನ್ನಡ','Español'].map(l=>`<button class="chip ${A.lang.includes(l)?'on':''}" aria-pressed="${A.lang.includes(l)}" onclick="lang('${l}')">${l}</button>`).join('')}</div></div></div>
 <label class="field" style="margin-top:16px"><span>Greeting</span><textarea class="ta" rows="2" oninput="S.agent.greet=this.value">${esc(greet())}</textarea></label></div></div>`,foot:footer()}};
function chooseVoice(id){const v=VOICES.find(x=>x.id===id),old=VOICES.find(x=>x.id===S.agent.voice);if(S.agent.name===old.n)S.agent.name=v.n;S.agent.voice=id;S.play=id;render();speak(greet(),v);setTimeout(()=>{if(S.play===id){S.play=null;if(STEPS[S.i].id==='voice')render()}},2800)}
function speak(t,v){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.pitch=v.pitch;u.rate=v.rate;speechSynthesis.speak(u)}catch(e){}}
function lang(l){const a=S.agent.lang,i=a.indexOf(l);if(i>-1&&a.length>1)a.splice(i,1);else if(i<0)a.push(l);render()}

/* review: talk to it. Free text, answered from the user's own setup */
function reply(q){const s=q.toLowerCase(),R=S.rules,o=S.o,n=+((s.match(/\d+/)||[])[0]);
 if(/table|book|reserv|seat|party|people|guests|group/.test(s)){const g=n||4;return g>R.maxParty?`For groups over ${R.maxParty} I’ll take your details and someone from ${brandShort()} will call you back within the hour.`:`Yes, I can hold a table for ${g}. I’ll keep it for ${R.hold} minutes. What name should I put it under?`}
 if(/hour|open|close|when|time/.test(s))return`We’re open ${hoursText().replace('Every day','every day')}.`;
 const w=s.split(/\W+/).filter(x=>x.length>3);
 for(const f of o.faqs){if(w.some(x=>f[0].toLowerCase().includes(x)))return f[1]}
 return`I’m not sure about that one. I’ll take your number and have the team call you right back.`}
function startCall(){S.started=true;S.chat=[['a',greet()]];render()}
const scrollDown=()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
function ask(q){q=(q||'').trim();if(!q||S.typing)return;S.chat.push(['g',q]);S.typing=true;render();scrollDown();
 setTimeout(()=>{S.typing=false;S.chat.push(['a',reply(q)]);render();scrollDown();const i=$('#tq');if(i)i.focus()},1000)}
VIEWS.test=()=>{const o=S.o,A=S.agent;
 const chat=S.chat.map(([w,t])=>`<div class="m ${w}"><small>${w==='a'?esc(A.name):'You'}</small>${esc(t)}</div>`).join('')+(S.typing?'<div class="m"><div class="dots"><i></i><i></i><i></i></div></div>':'');
 const sg=['Table for 4 tonight','Table for 12 on Saturday','What are your hours?',o.faqs[0]?o.faqs[0][0]:'Do you deliver?'];
 return{body:`<div class="body fade">${ctx()}${head(`Try calling ${A.name}.`,'Ask anything a guest would. This is what callers will get.')}
 ${S.started?`<div class="chat" role="log" aria-live="polite">${chat}</div>
 <div class="sugg">${sg.map(x=>`<button class="chip" ${S.typing?'disabled':''} onclick="ask(this.textContent)">${esc(x)}</button>`).join('')}</div>
 <form onsubmit="event.preventDefault();const i=$('#tq');const v=i.value;i.value='';ask(v)"><div class="ask" style="height:52px"><input id="tq" placeholder="Ask ${esc(A.name)} something…" autocomplete="off" aria-label="Your question"/><button type="submit" aria-label="Send">${ic('up',16)}</button></div></form>`
 :`<div class="sec"><button class="btn" onclick="startCall()">Start test call</button></div>`}
 <div class="ready"><span>Hours</span><span>${o.faqs.length} answers</span><span>Up to ${S.rules.maxParty} guests</span><span>${esc(A.name)}’s voice</span></div></div>`,
 foot:footer({next:'Sounds good',ok:S.chat.length>2,why:S.started?'Ask one question to continue':'Start the test call to continue'})}};

VIEWS.live=()=>{const num='+1 (312) 555-0147',F=S.fwd,A=S.agent;
 return{body:`<div class="body fade">${ctx()}${head(`Send your calls to ${A.name}.`,'Forward your restaurant line to your Tringg number. It takes about a minute, and you can switch back anytime.')}
 <div class="sec"><div class="lbl">Your Tringg number</div><div class="num"><span class="mono">${num}</span><button class="btn line" onclick="copyNum(this)">Copy</button></div></div>
 <div class="sec"><div class="lbl">When should ${esc(A.name)} answer?</div>
 <button class="choice ${F==='busy'?'on':''}" onclick="S.fwd='busy';render()"><span class="rad"></span><span><b>When we can’t pick up</b><span class="d">Staff still get calls first. Recommended to start.</span></span></button>
 <button class="choice ${F==='all'?'on':''}" onclick="S.fwd='all';render()"><span class="rad"></span><span><b>Every call</b><span class="d">${esc(A.name)} answers everything and hands off to staff when needed.</span></span></button>
 <p class="hint">From your restaurant phone, dial <span class="mono" style="color:var(--ink);font-size:13px">${F==='busy'?'*61*':'*21*'}13125550147#</span>. Using a cloud PBX or POS? <button class="lnk">See setup guides</button></p>
 <label class="check"><input type="checkbox" ${S.fwdDone?'checked':''} onchange="S.fwdDone=this.checked;render()"/> I’ve set up call forwarding</label></div></div>`,
 foot:footer({next:'Go live',ok:S.fwdDone,why:'Confirm forwarding to go live'})}};
function copyNum(b){try{navigator.clipboard.writeText('+13125550147').catch(()=>{})}catch(e){}b.textContent='Copied';setTimeout(()=>{if(b.isConnected)b.textContent='Copy'},1500)}

VIEWS.done=()=>({body:`<div class="fin fade"><div class="tick">${ic('check',26)}</div>${head(`${S.agent.name} is now answering for ${brandShort()}.`,'Call your Tringg number to hear it. Every call appears in your dashboard with a transcript.')}
 <div class="num"><span class="mono">+1 (312) 555-0147</span></div><a class="btn" href="tringg-ordering.html" style="text-decoration:none">Open dashboard</a>
 <div class="next"><div><b>Add your menu</b><span>So ${esc(S.agent.name)} can take orders.</span></div><div><b>Invite your team</b><span>Get call and booking alerts.</span></div><div><b>Connect your POS</b><span>Orders flow in automatically.</span></div></div></div>`});

render();
</script>
</body>
</html>
